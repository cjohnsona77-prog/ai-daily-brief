name: Daily AI Brief

on:
  schedule:
    # Runs at 10:00 UTC (5:00 AM CT during CDT)
    # Adjust for your timezone. GitHub Actions cron uses UTC.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run daily brief
        env:
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python automation/daily_brief.py

      - name: Persist seen URLs cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/seen_urls.json
          git diff --staged --quiet || git commit -m "chore: update seen URLs cache [skip ci]"
          git push
